# 在 GitHub Actions 上构建 Reader 的玲珑包（amd64 layer）
#
# 使用方法：把本工程目录（linglong.yaml、install_dep、.github/）的内容
# 作为仓库根目录推送到 GitHub 即可自动触发构建。
#
# 产物：*.layer（玲珑安装包），在 Actions 页面下载，或推 tag 时自动发布到 Release。
# 安装：在 UOS 20 上执行 ll-cli install ./com.hadc188.reader_1.6.5.0_x86_64_binary.layer

name: Build Linglong Package

on:
  push:
    branches: ["main", "master", "ci-test"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

concurrency:
  group: build-linglong-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ll-builder build (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri/Rust 构建产物很大，腾出磁盘空间（base 层 + cargo target 约 10GB+）
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      # 安装如意玲珑构建工具链（官方 release 仓库，适用于 Ubuntu 24.04 托管运行器）
      - name: Install linglong toolchain
        run: |
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" \
            | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y linglong-builder linglong-box linglong-bin
          ll-cli --version
          ll-builder --version || true

      # 构建容器内会自动拉取 git 源码、Node 22、Rust 与全部 deb 依赖并编译
      - name: Build
        run: ll-builder build -v

      # 导出玲珑 layer 安装包（binary + develop）
      - name: Export layer
        run: ll-builder export --layer

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -maxdepth 2 -name "*.layer" -not -path "./dist/*" -exec cp -v {} dist/ \;
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reader-linglong-layer
          path: dist/*.layer
          if-no-files-found: error
          retention-days: 30

      # 推送 v* 标签时，自动把 layer 发布到 GitHub Release
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.layer \
            --title "Reader 玲珑包 $GITHUB_REF_NAME" \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/*.layer --clobber
