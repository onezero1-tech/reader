# 在 GitHub Actions 上构建 Reader 的玲珑包（amd64 layer）
#
# 流水线拆分为两个独立 job，互不拖累：
#   1. build-binary    在 ubuntu-24.04 上编译前端 + Rust 主程序（带 npm/Rust 缓存，
#                      失败重跑只需重新编译增量部分，一般 5~10 分钟）
#   2. package-linglong  用 ll-builder 把预编译二进制 + webkit/托盘/字体依赖打包成
#                      .layer（base 层与 deb 依赖有缓存，一般 3~5 分钟）
#
# 产物：*.layer 在 Actions 页面下载；推 v* 标签时自动发布到 GitHub Release。
# 安装：在 UOS 20 上执行 ll-cli install ./com.hadc188.reader_1.6.5.0_x86_64_binary.layer
#
# 升级 Reader 版本时：更新下方 READER_REF（reader 仓库的 commit）和 linglong.yaml 里的 version。

name: Build Linglong Package

env:
  # 要打包的 reader 源码版本（commit）
  READER_REPO: onezero1-tech/reader
  READER_REF: dba5d36ce3eae900f2521ad1cb81fd03b96e70e8

on:
  push:
    branches: ["main", "master", "ci-test"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

concurrency:
  group: build-linglong-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Job 1：编译 reader-desktop（Rust + Vue 前端） ----------
  build-binary:
    name: Build reader-desktop (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout reader source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.READER_REPO }}
          ref: ${{ env.READER_REF }}

      # GitHub Actions 每次运行都是全新环境，上一次运行成功的编译产物不会自动复用。
      # 这里以 READER_REF（锁定的 reader commit）为 key 缓存最终二进制：
      # 只有 linglong.yaml / install_dep 改动而 READER_REF 不变时，本 job 直接命中缓存、
      # 跳过全部编译步骤（约 1 分钟）；READER_REF 变了才重新编译并刷新缓存。
      # 注意：GitHub 缓存 7 天未被访问会被自动回收，届时会重新全量编译一次。
      - name: Restore prebuilt binary cache
        id: binary_cache
        uses: actions/cache@v4
        with:
          path: stage/
          key: reader-desktop-binary-${{ env.READER_REF }}

      - name: Skip compile on cache hit
        if: steps.binary_cache.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit for READER_REF=${READER_REF}, skip compiling"
          test -f stage/reader-desktop
          test -f stage/icons/128x128.png
          test -f stage/icons/icon.png
          file stage/reader-desktop
          ls -lhR stage/

      - name: Setup Node.js 22
        if: steps.binary_cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # 链接期只需要 -dev 头文件与 .so，运行期由玲珑 layer 自带 deepin 版 webkit/托盘库
      - name: Install link-time dependencies
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config file

      - name: Setup Rust stable
        if: steps.binary_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      # Rust 增量编译缓存：命中后 cargo 编译从 30 分钟降到 5 分钟左右。
      # reader 仓库根就是 cargo workspace（Cargo.lock 与 target/ 都在仓库根），
      # 因此缓存路径必须填仓库根，而不是 desktop/src-tauri。
      - name: Rust cache
        if: steps.binary_cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Build frontend (Vue 3)
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm run build

      - name: Build desktop (Tauri v2, no bundle)
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          cd desktop
          npm ci --no-audit --no-fund
          npx tauri build --no-bundle

      # tauri build 在 desktop/ 下执行，但 cargo workspace 根在仓库根，
      # 产物实际位于 <repo-root>/target/release/reader-desktop。
      # 这里自动定位，避免路径再次写错。
      - name: Stage artifacts
        if: steps.binary_cache.outputs.cache-hit != 'true'
        run: |
          BIN=$(find "$GITHUB_WORKSPACE" -type f -name reader-desktop -path '*/release/*' -print -quit)
          if [ -z "$BIN" ]; then
            echo "ERROR: reader-desktop binary not found under target/release/"
            find "$GITHUB_WORKSPACE" -name 'reader-desktop*' -not -path '*/node_modules/*' || true
            exit 1
          fi
          echo "Found binary: $BIN"
          mkdir -p stage/icons
          cp -v "$BIN" stage/reader-desktop
          cp -v desktop/src-tauri/icons/128x128.png stage/icons/
          cp -v desktop/src-tauri/icons/icon.png stage/icons/
          file stage/reader-desktop
          ls -lhR stage/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-desktop
          path: stage/
          if-no-files-found: error
          retention-days: 7

  # ---------- Job 2：打包成玲珑 layer ----------
  package-linglong:
    name: Package linglong layer (x86_64)
    needs: build-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      # ll-builder / linglong-box 在无桌面环境的 CI 上必须有可写的 XDG_RUNTIME_DIR
      XDG_RUNTIME_DIR: /run/user/1001

    steps:
      - name: Checkout packaging project
        uses: actions/checkout@v4

      # 预编译产物放到项目根目录：构建容器内可见为 /project/reader-desktop 与 /project/icons/
      - name: Download prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: reader-desktop
          path: .

      - name: Verify staged files
        run: |
          test -f reader-desktop
          test -f icons/128x128.png
          test -f icons/icon.png
          ls -lh reader-desktop icons/

      # 缓存预解包的 deb payload（webkit/托盘/字体，约几百 MB），
      # debs.txt 不变时直接命中，避免每次重复下载 65 个 deb
      - name: Cache deb payload
        id: payload_cache
        uses: actions/cache@v4
        with:
          path: payload/
          key: deb-payload-${{ hashFiles('debs.txt') }}

      # 在宿主机上下载 + 校验 + 解包全部 deb 到 payload/：
      # 25.2.0.94 的 base binary 是精简 rootfs（无 apt/binutils/zstd/patchelf），
      # 容器内无法解包，只能提前在 runner 上做好，容器内只拷贝
      - name: Install host extraction tools
        if: steps.payload_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf file curl

      - name: Prepare payload (extract debs on host)
        if: steps.payload_cache.outputs.cache-hit != 'true'
        # 用 bash 显式调用，避免 git 丢失可执行位导致 Permission denied
        run: bash prepare_payload.sh debs.txt payload

      - name: Verify payload
        run: |
          test -d payload/usr/lib/x86_64-linux-gnu
          test -f payload/usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0
          test -f payload/packages.list
          du -sh payload/
          wc -l payload/packages.list

      # 缓存玲珑 base 层（首次约 5~10GB，命中后打包 job 只需 3~5 分钟）
      - name: Cache linglong builder
        uses: actions/cache@v4
        with:
          path: ~/.cache/linglong-builder/
          key: linglong-builder-cache-x86_64
          restore-keys: linglong-builder-cache-x86_64

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      # 安装如意玲珑构建工具链（官方 release 仓库，适用于 Ubuntu 24.04 托管运行器）
      - name: Install linglong toolchain
        run: |
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" \
            | sudo tee /etc/apt/sources.list.d/linglong.list
          sudo apt-get update
          sudo apt-get install -y linglong-builder linglong-box linglong-bin xdg-utils
          ll-cli --version
          ll-builder --version || true

      - name: Build layer
        run: |
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown -R 1001:1001 "$XDG_RUNTIME_DIR"
          sudo chmod 0700 "$XDG_RUNTIME_DIR"
          # 注意：ll-builder 1.14+ 已移除 -v/--verbose 选项
          ll-builder build

      - name: Export layer
        run: ll-builder export --layer

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find . -maxdepth 2 -name "*.layer" -not -path "./dist/*" -exec cp -v {} dist/ \;
          ls -lh dist/

      - name: Upload layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-linglong-layer
          path: dist/*.layer
          if-no-files-found: error
          retention-days: 30

      # 推送 v* 标签时，自动把 layer 发布到 GitHub Release
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.layer \
            --title "Reader 玲珑包 $GITHUB_REF_NAME" \
            --generate-notes || \
          gh release upload "$GITHUB_REF_NAME" dist/*.layer --clobber
