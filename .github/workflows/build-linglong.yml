# Reader 玲珑包 CI —— 双 job 流水线（编译 + 打包，缓存互相独立）
#
# 打包路线：ll-killer（社区构建工具，verge-rev 同款），交付物为 *.layer
#   ll-killer layer build  不做任何依赖拉取，直接在 runner 的 user/mount/pid
#   namespace 中执行 linglong.yaml 的 build 脚本，产物 *_binary.layer 即最终
#   交付物（verge-rev 同款，直接发布 layer、不导出 UAB）。
#
#   为什么不导出 UAB：实测 ll-builder export 生成的 UAB 在 linglong 1.10.6
#   客户端上安装失败（解析 layers/<app>/binary/info.json 时报
#   "load json from file ... read all: 不支持的操作"，新旧构建器 UAB 格式
#   不兼容）；而 layer 文件安装、运行均正常，故与 verge-rev 保持一致只发 layer。
#
# 为什么必须走 ll-killer：org.deepin.runtime.gtk4 只发布在社区测试源
# （cdn-linglong.odata.cc），官方镜像 mirror-repo-linglong.deepin.com 上没有该 ref
# （已实测：官方 15716 个 ref 中 0 个 runtime.gtk4）。ll-builder build 的
# "stage pull dependency" 阶段按优先级逐仓检索依赖，官方源查不到且无备用源时
# 直接失败（exit 255）；而 `ll-builder repo` 子命令在 1.14 走 DBus 包管理器，
# CI runner 上没有 linglong 守护进程，无法用命令行添加社区源。
# ll-killer 构建期完全不解析/拉取 base 和 runtime，从根上绕开该问题。
#
# 安装侧前提：终端用户安装本包时 ll-cli 仍需解析 org.deepin.runtime.gtk4/25.2.2
# （该 runtime 仅存在于社区测试源），需先添加社区测试源再安装：
#   ll-cli repo add community https://cdn-linglong.odata.cc
#   ll-cli install com.hadc188.reader_1.6.6.0_x86_64_binary.layer
#
# 代码更新后的操作说明：
#   情况 A（发布固定版本）：把 env.READER_REF 改成目标 commit 的完整 sha
#   情况 B（跟踪分支最新提交）：env.READER_REF 填分支名（main/master）。
#       缓存 key 已包含实际源码 commit sha（SOURCE_SHA），每个提交自动
#       重新编译；同一次构建重跑（re-run）仍命中缓存。无需手动清缓存。
#   情况 C（版本变更）：只改下方 APP_VERSION 一处，会自动注入 linglong.yaml
#       的 package.version（注意保持 1.6.6.0 这种 4 段纯数字格式，ll-killer
#       要求 package.version 必须是 MAJOR.MINOR.PATCH.TWEAK 四段）。
#   依赖层 debs.txt 只含 5 个托盘 deb（其余依赖由 org.deepin.runtime.gtk4
#   提供），payload 缓存不变时永远命中——代码更新只重跑编译 job。

name: Build Linglong Package

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: '要编译的 reader ref（commit sha 或分支，留空 = READER_REF）'
        required: false
        default: ''

env:
  READER_REPO: onezero1-tech/reader
  # 情况 A：写死 commit sha；情况 B：改成 main / master 跟踪分支
  READER_REF: dba5d36ce3eae900f2521ad1cb81fd03b96e70e8
  # 情况 C：发新版本时只改这里（会被 sed 注入 linglong.yaml 的 package.version）
  APP_VERSION: 1.6.6.0
  XDG_RUNTIME_DIR: /run/user/1001

jobs:
  # ================= job 1: 编译 reader-desktop（与玲珑无关，独立缓存） =================
  # 关键约束：玲珑 base（deepin 23/25）的 glibc 是 2.38，而 Ubuntu 24.04 runner
  # 的 glibc 是 2.39——直接在 runner 上编译的产物会引用 GLIBC_2.39，运行时报
  #   weak version `GLIBC_2.39' not found (required by reader)
  # 这是弱引用警告，启动不会挂，但一旦真正调到 2.39 才有的符号就直接段错误，
  # 所以必须把目标 glibc 压到 ≤2.38（这里选 2.35 留余量，兼容 UOS/麒麟老环境）。
  # 做法：cargo-zigbuild（zig 作为链接器，指定 glibc 目标版本）。
  build-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout reader source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.READER_REPO }}
          ref: ${{ github.event.inputs.ref || env.READER_REF }}

      # 缓存 key 的代码版本成分：checkout 到哪个 commit 就用哪个，
      # 这样 READER_REF 填分支名（情况 B）时每个提交也会产生独立缓存键
      - name: Resolve source commit for cache key
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore staged binary
        id: bin-cache
        uses: actions/cache@v4
        with:
          path: stage/
          # 注意：不要加 restore-keys，否则新代码会回退到旧二进制
          # v2 前缀：换 cargo-zigbuild（glibc 2.35）编译后强制丢弃旧 key 下的
          # glibc 2.39 产物，防止命中旧缓存导致 GLIBC 警告复现
          key: reader-desktop-binary-v2-${{ env.SOURCE_SHA }}

      - name: Validate staged files
        id: staged
        run: |
          ok=true
          for f in stage/reader-desktop stage/icons/128x128.png stage/icons/icon.png; do
            [ -f "$f" ] || { echo "missing: $f"; ok=false; }
          done
          echo "valid=$ok" >> "$GITHUB_OUTPUT"

      # ---------- 以下构建步骤仅在缓存未命中或缓存不完整时执行 ----------
      - name: Install system dependencies
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev pkg-config file

      - name: Setup Node 22
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Rust stable
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # cargo workspace 根在仓库根（Cargo.lock / target/ 都在根目录）
          workspaces: .

      # cargo-zigbuild：pip 安装时自动带上配套的 ziglang（版本兼容由 PyPI
      # 依赖关系钉死，无需手动选 zig 版本）。装在独立 venv 里绕开 Ubuntu 24.04
      # 的 PEP 668（externally-managed-environment）限制。
      - name: Install cargo-zigbuild
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        run: |
          python3 -m venv /tmp/zigbuild-venv
          /tmp/zigbuild-venv/bin/pip install --upgrade pip
          /tmp/zigbuild-venv/bin/pip install cargo-zigbuild
          echo "/tmp/zigbuild-venv/bin" >> "$GITHUB_PATH"
          # ziglang 装在 venv 内，系统 python3 看不到；显式告诉 zigbuild 用哪个 python
          echo "CARGO_ZIGBUILD_PYTHON_PATH=/tmp/zigbuild-venv/bin/python" >> "$GITHUB_ENV"
          /tmp/zigbuild-venv/bin/cargo-zigbuild zigbuild --help >/dev/null && echo "cargo-zigbuild OK"

      - name: Build frontend
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # 用 cargo zigbuild 代替 npx tauri build：
      #   - tauri CLI 对 cargo 的封装不影响产物（frontendDist 已由上一步构建好，
      #     custom-protocol feature 编译期内嵌资源，beforeBuildCommand 只是 echo）
      #   - zigbuild 指定 glibc 2.35 目标，消除 GLIBC_2.39 引用（见 job 顶部说明）
      #   - CFLAGS=-isystem /usr/include：让 zig cc 对非 glibc 头文件（gtk/webkit
      #     开发头在 /usr/include 子目录）回退到系统头文件路径
      - name: Build desktop (cargo zigbuild, glibc 2.35)
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        env:
          CFLAGS: -isystem /usr/include
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.35 -p reader-desktop

      - name: Stage artifacts
        if: steps.bin-cache.outputs.cache-hit != 'true' || steps.staged.outputs.valid != 'true'
        run: |
          # tauri 在 desktop/ 下执行，但 cargo workspace 根在仓库根，产物用 find 定位
          bin=$(find "$GITHUB_WORKSPACE" -type f -name reader-desktop -path '*/release/*' -print -quit)
          if [ -z "$bin" ]; then
            echo "ERROR: reader-desktop not found, candidates:"
            find "$GITHUB_WORKSPACE" -type f -name 'reader-desktop' | head -20
            exit 1
          fi
          echo "staging: $bin"
          mkdir -p stage/icons
          install -Dm755 "$bin" stage/reader-desktop
          cp desktop/src-tauri/icons/128x128.png stage/icons/128x128.png
          cp desktop/src-tauri/icons/icon.png     stage/icons/icon.png

      # 硬校验：产物的最高 GLIBC 符号版本不得超过 2.35（cache 命中时也会执行）
      - name: Verify glibc compatibility
        run: |
          test -f stage/reader-desktop || { echo "stage/reader-desktop missing"; exit 1; }
          maxver=$(objdump -T stage/reader-desktop \
            | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 | cut -d_ -f2)
          echo "max GLIBC symbol version: $maxver"
          if [ "$(printf '%s\n' 2.35 "$maxver" | sort -V | tail -1)" != "2.35" ]; then
            echo "FAIL: 二进制需要 GLIBC $maxver，超过目标 2.35（deepin 25 只有 2.38，老系统更低）"
            objdump -T stage/reader-desktop | grep -E 'GLIBC_2\.(3[6-9]|[4-9][0-9])' | head -20
            exit 1
          fi

      - name: Upload staged binary
        uses: actions/upload-artifact@v4
        with:
          name: reader-binary
          path: stage/
          retention-days: 7

  # ================= job 2: 打玲珑包（ll-killer 路线，不编译代码） =================
  package-linglong:
    needs: build-binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # 关键：这里 checkout 默认 ref（触发本次 CI 的提交），保证拿到最新的
      # linglong.yaml / debs.txt / prepare_payload.sh。
      # 不要改成 READER_REF——那是给源码编译用的；指向旧 commit 会因缺少
      # linglong.yaml 报错。
      - name: Checkout packaging project
        uses: actions/checkout@v4

      # 显式守卫：工程文件缺失时立刻报错并列出目录
      - name: Guard packaging files present
        run: |
          pwd
          ls -la
          test -f linglong.yaml      || { echo "ERROR: linglong.yaml missing"; exit 1; }
          test -f debs.txt           || { echo "ERROR: debs.txt missing"; exit 1; }
          test -f prepare_payload.sh || { echo "ERROR: prepare_payload.sh missing"; exit 1; }

      # 情况 C：把 APP_VERSION 注入 linglong.yaml，发版只改 workflow 顶部一处
      # （sed 只匹配两段缩进的 version，即 package.version；顶层的 version: '1' 不受影响）
      - name: Inject app version
        run: |
          sed -i "s/^  version: .*/  version: ${APP_VERSION}/" linglong.yaml
          grep -n 'version' linglong.yaml

      - name: Prepare XDG runtime dir
        run: |
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown -R 1001:1001 "$XDG_RUNTIME_DIR"
          sudo chmod 0700 "$XDG_RUNTIME_DIR"

      # 工具链与 verge-rev 保持一致：linglong-box（ll-box，ll-killer 的运行环境）、
      # erofs-utils（mkfs.erofs，layer 打包用）、fuse-overlayfs（构建命名空间 overlay）。
      # 不再装 linglong-builder/linglong-bin——那是 import/export UAB 用的，现已移除。
      - name: Install linglong toolchain
        run: |
          # 官方 apt 源在 ci.deepin.com 的 OBS 镜像上（注意目录名是 Ubuntu_24.04，
          # 不是 opensuse.org 的 xUbuntu_24.04——那个路径不存在，会 404）
          echo "deb [trusted=yes] https://ci.deepin.com/repo/obs/linglong:/CI:/release/Ubuntu_24.04/ ./" \
            | sudo tee /etc/apt/sources.list.d/linyaps.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y linglong-box erofs-utils fuse-overlayfs
          ll-box --version || true

      # ll-killer：社区构建工具，layer build 模式不需要任何 linglong 仓库
      # （构建期不拉 base/runtime，宿主 rootfs + /project 直接构建并 erofs 打包）
      - name: Install ll-killer
        run: |
          set -e
          curl -fsSL --retry 3 --connect-timeout 30 -o ll-killer \
            https://github.com/System233/ll-killer-go/releases/latest/download/ll-killer-amd64 \
          || curl -fsSL --retry 3 --connect-timeout 30 -o ll-killer \
            https://ll-killer.win/releases/latest/download/ll-killer-amd64
          chmod +x ll-killer
          sudo mv ll-killer /usr/local/bin/ll-killer
          command -v ll-killer
          ll-killer --help | head -5

      # Ubuntu 24.04 runner 的 AppArmor 默认开启
      # kernel.apparmor_restrict_unprivileged_userns=1，禁止普通进程创建
      # user namespace。ll-killer 进入 build 阶段后要 unshare(CLONE_NEWUSER)
      # 并通过 /proc/self/exe 重启自身来搭 mount/pid namespace，被 AppArmor
      # 拦下时报 "fork/exec /proc/self/exe: operation not permitted"。
      # 这里关掉该限制（runner 有免密 sudo）；ubuntu-22.04 runner 无此限制。
      - name: Allow unprivileged user namespaces (Ubuntu 24.04 AppArmor)
        run: |
          echo "before: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'sysctl not present')"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # 持久化到 runner 本机，防止后续步骤/复用环境中被重置
          echo 'kernel.apparmor_restrict_unprivileged_userns = 0' \
            | sudo tee /etc/sysctl.d/99-ll-killer-userns.conf > /dev/null
          echo "after: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          # 双保险：即使 sysctl 被镜像默认策略覆盖，也给 ll-killer 单独开
          # unprivileged_userns 的 AppArmor profile（flags=(unprivileged_userns)）
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" != "0" ]; then
            sudo tee /etc/apparmor.d/ll-killer > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile ll-killer /usr/local/bin/ll-killer flags=(unprivileged_userns) {
            userns,
            include if exists <local/ll-killer>
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/ll-killer
            echo "apparmor profile for ll-killer installed"
          fi

      - name: Download staged binary
        uses: actions/download-artifact@v4
        with:
          name: reader-binary
          path: staged

      - name: Place binary & icons at project root
        run: |
          cp staged/reader-desktop ./reader-desktop
          mkdir -p icons
          cp staged/icons/128x128.png icons/128x128.png
          cp staged/icons/icon.png    icons/icon.png
          ls -la reader-desktop icons/

      - name: Restore tray payload
        id: payload-cache
        uses: actions/cache@v4
        with:
          path: payload/
          # 迁移到 org.deepin.runtime.gtk4 后 payload 只剩 5 个托盘 deb，
          # key 中的 v2 前缀避免命中旧的 71-deb 大缓存
          key: tray-payload-v2-${{ hashFiles('debs.txt') }}

      - name: Install payload tools
        run: sudo apt-get install -y patchelf file curl

      - name: Prepare payload (download & unpack tray debs)
        run: |
          # 以磁盘上的实际完整性为准，而不是缓存命中标记：
          # 缓存命中但恢复内容不完整时自动重新下载解包，避免静默缺文件
          # 注意：deepin 的 deb 是 usr-merged 布局，库在 payload/usr/lib/，
          # 不是 payload/lib/（后者只是部分 deb 带来的空目录）
          if [ -f payload/usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1 ] \
             && [ -f payload/packages.list ]; then
            echo "payload already complete (from cache), skip download"
            exit 0
          fi
          bash prepare_payload.sh debs.txt payload

      - name: Verify payload
        run: |
          test -d payload/usr/lib/x86_64-linux-gnu \
            || { echo "FAIL: payload/usr/lib/x86_64-linux-gnu missing"; exit 1; }
          test -f payload/usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1 \
            || { echo "FAIL: libayatana-appindicator3.so.1 missing (tauri tray-icon 依赖)"; exit 1; }
          test -f payload/usr/lib/x86_64-linux-gnu/libdbusmenu-gtk3.so.4 \
            || { echo "FAIL: libdbusmenu-gtk3.so.4 missing"; exit 1; }
          test -f payload/packages.list \
            || { echo "FAIL: packages.list missing"; exit 1; }
          du -sh payload
          count=$(wc -l < payload/packages.list)
          echo "packages.list lines: $count"
          [ "$count" -eq 5 ] || { echo "FAIL: packages.list 应为 5 个托盘包，实际 $count"; exit 1; }

      # 不做任何依赖拉取：layer build 在命名空间里用宿主 rootfs 执行
      # linglong.yaml 的 build 脚本（纯拷贝二进制/托盘库/图标），产物直接
      # erofs 打包为 com.hadc188.reader_${APP_VERSION}_x86_64_binary.layer
      - name: ll-killer layer build
        run: |
          ll-killer layer build --no-post-setup
          echo "== layer output =="
          ls -la *.layer || true
          layer_count=$(ls *_binary.layer 2>/dev/null | wc -l)
          [ "$layer_count" -eq 1 ] || {
            echo "FAIL: expected exactly 1 *_binary.layer, got $layer_count"
            find . -maxdepth 3 -name '*.layer' -o -maxdepth 3 -name '*.uab' 2>/dev/null || true
            exit 1
          }

      # layer 即最终交付物：不再 import/export UAB
      # （实测 1.14 导出的 UAB 在 linglong 1.10.6 客户端安装失败，layer 安装运行正常）
      - name: Upload layer artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-linglong-layer
          path: com.hadc188.reader_*_binary.layer
          retention-days: 30

      # 打 tag 时自动把 layer 挂到 GitHub Release
      - name: Release layer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: com.hadc188.reader_*_binary.layer
