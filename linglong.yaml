build: |
  set -e
  SRC=/project/linglong/sources/reader

  # ---------- 0. install_dep 所需的小工具（容器内尽力安装，失败不影响构建） ----------
  apt-get update || true
  apt-get install -y --no-install-recommends zstd patchelf binutils file xz-utils curl ca-certificates || true

  # ---------- 1. 安装 Node.js 22 ----------
  curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz -o /tmp/node.tar.xz
  mkdir -p /opt/nodejs
  tar -xJf /tmp/node.tar.xz -C /opt/nodejs --strip-components=1
  export PATH=/opt/nodejs/bin:$PATH

  # ---------- 2. 安装 Rust stable ----------
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
  export PATH="$HOME/.cargo/bin:$PATH"

  # ---------- 3. 先把 webkit2gtk-4.1 / 托盘 / 字体依赖解压到 $PREFIX（供 pkg-config 与运行期使用） ----------
  bash ./install_dep linglong/sources $PREFIX
  export PKG_CONFIG_PATH="$PREFIX/lib/${TRIPLET}/pkgconfig:$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"

  # ---------- 4. 构建 frontend ----------
  cd "$SRC/frontend"
  if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
  npm run build

  # ---------- 5. 构建 desktop（Tauri v2，不生成 bundle，直接用 cargo 产物） ----------
  cd "$SRC/desktop"
  if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
  export CARGO_BUILD_JOBS=4
  npx tauri build --bundles none

  # ---------- 6. 安装主程序 ----------
  install -Dm755 src-tauri/target/release/reader-desktop $PREFIX/bin/reader

  # ---------- 7. 修补 libwebkit2gtk-4.1.so.0 中硬编码的 WebKitNetworkProcess 路径 ----------
  # 用等长占位串替换，保证 ELF 内偏移不变（与官方 Tauri 示例做法一致）
  tmpdir=`mktemp -d /tmp/lib_XXXXXXXXXXXXXXXX_webkit2gtk-4.1`
  sed -i -b "s|/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1|$tmpdir|g" $PREFIX/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0

  # ---------- 8. 启动脚本：启动时把 $PREFIX 下的 webkit2gtk-4.1 链接到占位路径 ----------
  startScript="$PREFIX/bin/start-reader"
  echo "#!/bin/sh" > $startScript
  echo "rm -r $tmpdir" >> $startScript
  echo "ln -s $PREFIX/lib/x86_64-linux-gnu/webkit2gtk-4.1 $tmpdir" >> $startScript
  echo "reader" >> $startScript
  chmod +x $startScript

  # ---------- 9. 图标与桌面入口 ----------
  install -Dm644 "$SRC/desktop/src-tauri/icons/128x128.png" $PREFIX/share/icons/hicolor/128x128/apps/com.hadc188.reader.png
  install -Dm644 "$SRC/desktop/src-tauri/icons/icon.png" $PREFIX/share/icons/hicolor/256x256/apps/com.hadc188.reader.png
  mkdir -p $PREFIX/share/applications
  cat > $PREFIX/share/applications/com.hadc188.reader.desktop <<DESKTOP_EOF
  [Desktop Entry]
  Type=Application
  Name=Reader
  Name[zh_CN]=阅读
  GenericName=Reader
  Comment=阅读 3.0 桌面版（书源 / 书架 / RSS / 本地书籍）
  Exec=/opt/apps/com.hadc188.reader/files/bin/start-reader
  Icon=com.hadc188.reader
  Terminal=false
  Categories=Network;Utility;Literature;
  StartupNotify=true
  DESKTOP_EOF

