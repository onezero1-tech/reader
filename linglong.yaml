version: '1'

package:
  id: com.hadc188.reader
  name: Reader
  version: 1.6.5.0
  kind: app
  description: |
    Reader（阅读 3.0 桌面版）——本地阅读器应用，支持书源管理、书架、
    本地书籍阅读、RSS 订阅与自定义阅读界面。基于 Tauri v2 (Rust + Vue 3)。
    主程序由 CI 预先编译（见 .github/workflows/build-linglong.yml 的 build-binary job），
    本工程只负责把二进制与少量依赖打包成玲珑应用包。

command: [start-reader]

# ll-builder 只接受最多 3 段的依赖版本（MAJOR.MINOR[.PATCH]），4 段如 25.2.0.92 会在
# 构建前直接报 "base version is not valid"（apps/ll-builder/src/main.cpp 的
# Version::validateDependVersion 正则限制）。semanticMatch 会把 25.2.2 语义匹配到
# 仓库里的 25.2.2.x 实际版本。
base: org.deepin.base/25.2.2

# webkit2gtk-4.1 / GTK3 / GTK4 / libadwaita / gstreamer 等全部由社区统一 runtime
# 提供（linglongdev/org.deepin.runtime.gtk4，源码构建，webkit 2.50.4 以
# CMAKE_INSTALL_PREFIX=/runtime 编译，WebKitNetworkProcess 等辅助进程路径天然
# 指向 /runtime 挂载点，无需应用打补丁）。
#
# 注意两个事实（都已实测核实）：
# 1) 该 runtime 只在社区测试源 cdn-linglong.odata.cc 上，官方镜像
#    mirror-repo-linglong.deepin.com 的 15716 个 ref 中没有任何 runtime.gtk4。
# 2) CI 打包用 ll-killer layer build（verge-rev 同款），构建期完全不拉取
#    base/runtime，所以构建侧不需要配社区源；但终端用户安装时 ll-cli 仍要
#    解析本 runtime，需先执行：
#      ll-cli repo add community https://cdn-linglong.odata.cc
runtime: org.deepin.runtime.gtk4/25.2.2

# runtime 缺两类库（debs.txt 共 8 个 deb，宿主机 prepare_payload.sh 解包到
# payload/，含 sha256 校验，随工程挂载进构建环境后由下方 build 拷进 $PREFIX）：
# 1) 托盘库（tauri tray-icon -> libayatana-appindicator3，依赖闭环：
#    appindicator3 -> indicator3 -> ido3 / dbusmenu-gtk3 -> dbusmenu-glib，
#    其余依赖 gtk3/glib/pango 均由 runtime 提供）；
# 2) gst libav 插件的 blas 系依赖（libblas3/liblapack3/libgfortran5）：runtime
#    自带的 libgstlibav.so 是 <video> 播放 mp4/H.264 的主力软解，实测因缺
#    libblas.so.3 加载失败，视频永远转圈。libblas3/liblapack3 的库在多架构
#    目录的 blas/ lapack/ 子目录里（update-alternatives 布局），常规路径软链
#    由 prepare_payload.sh 兼容段补出，启动脚本的 LD_LIBRARY_PATH 即可解析。

# 本 build 脚本由 ll-killer layer build 在 runner 的命名空间内执行：
# 根文件系统 = runner 宿主根（ubuntu-24.04），/project = 本工程目录，
# $PREFIX = /opt/apps/com.hadc188.reader/files（自动绑定到 layer 的 files/）。
# 纯文件拷贝，不联网、不需要 apt/gcc/patchelf。
build: |
  set -e

  test -f /project/reader-desktop || { echo "ERROR: /project/reader-desktop missing"; ls -la /project; exit 1; }
  test -f /project/icons/128x128.png || { echo "ERROR: /project/icons missing"; exit 1; }
  test -d /project/payload/usr || { echo "ERROR: /project/payload missing (prepare_payload.sh 未执行?)"; ls -la /project; exit 1; }

  # ---------- 0) payload 自检(与 CI 的 Verify payload 一致) ----------
  # 本地 ll-killer 构建不经过 CI 的硬校验, 过期的 payload/ 目录(只有托盘库)
  # 也能通过上面的 test -d。缺 libblas.so.3 时 runtime 层的 libgstlibav.so
  # (mp4/H.264 主力软解)加载失败, <video> 播放永远转圈/失败 —— 在这里就
  # 大声失败, 不打出缺库的包。debs.txt 更新后需重新执行:
  #   bash prepare_payload.sh debs.txt payload
  test -f /project/payload/usr/lib/x86_64-linux-gnu/libblas.so.3 \
    || { echo "ERROR: payload 缺 libblas.so.3 (gst libav 解码依赖)。请在仓库根目录重新执行: bash prepare_payload.sh debs.txt payload"; exit 1; }
  test -f /project/payload/usr/lib/x86_64-linux-gnu/liblapack.so.3 \
    || { echo "ERROR: payload 缺 liblapack.so.3 (gst libav 解码依赖)"; exit 1; }
  test -f /project/payload/usr/lib/x86_64-linux-gnu/libgfortran.so.5 \
    || { echo "ERROR: payload 缺 libgfortran.so.5 (liblapack3 依赖)"; exit 1; }

  # ---------- 1. 拷贝托盘库（runtime 未含的少量依赖）到 $PREFIX ----------
  # deepin deb 是 usr-merged 布局，库在 payload/usr/lib/x86_64-linux-gnu/
  cp -rP /project/payload/usr/. $PREFIX/

  # ---------- 2. 安装主程序（预编译产物） ----------
  install -Dm755 /project/reader-desktop $PREFIX/bin/reader

  # ---------- 3. 启动脚本 ----------
  # 托盘库装在应用自己的 usr/lib 下，启动时补进 LD_LIBRARY_PATH。
  # /runtime/lib/x86_64-linux-gnu 必须显式加入：GStreamer 插件
  # (libgstlibav.so 等, 位于 /runtime/.../gstreamer-1.0/) 是运行时 dlopen 的,
  # 其依赖(libavcodec.so.60 / libavutil.so.58 等)在 /runtime/lib 下; 容器里
  # WebKitWebProcess 的 LD_LIBRARY_PATH 只有应用自己的目录, 插件 dlopen 时
  # 依赖解析不到 → 全部插件加载失败 → 注册表为空 → <video> 秒报
  # SRC_NOT_SUPPORTED(error 4) 且无任何 GStreamer 日志(1.6.8.0 实测)。
  # 同时消除 base 层 gstreamer 支持库(1.24.13)与 runtime(1.24.6) 混载。
  startScript="$PREFIX/bin/start-reader"
  echo '#!/bin/sh' > "$startScript"
  echo 'APPDIR=/opt/apps/com.hadc188.reader/files' >> "$startScript"
  echo 'export LD_LIBRARY_PATH="$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/lib/x86_64-linux-gnu:/runtime/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"' >> "$startScript"
  echo 'export WEBKIT_DISABLE_DMABUF_RENDERER=1' >> "$startScript"
  # 独立注册表: 容器与宿主 deepin 共享 ~/.cache, 两侧 gstreamer 版本不同
  # (runtime 1.24.6 / 宿主 1.24.13), 共用 registry.x86_64.bin 会互相判定
  # 版本不符触发全量重扫、互相覆盖, 各用各的注册表文件最稳。
  echo 'export GST_REGISTRY="${XDG_CACHE_HOME:-$HOME/.cache}/gstreamer-1.0/reader-registry.bin"' >> "$startScript"
  # 调试钩子: touch ~/reader-gst-debug 后重启应用即开 GST_DEBUG=3。
  # ll-cli run 不透传外部环境变量, GST_DEBUG 只能从启动脚本内部注入。
  echo 'if [ -e "$HOME/reader-gst-debug" ]; then export GST_DEBUG=3 GST_DEBUG_NO_COLOR=1; fi' >> "$startScript"
  echo 'exec "$APPDIR/bin/reader"' >> "$startScript"
  chmod +x "$startScript"

  # ---------- 4. 图标与桌面入口 ----------
  install -Dm644 /project/icons/128x128.png $PREFIX/share/icons/hicolor/128x128/apps/com.hadc188.reader.png
  install -Dm644 /project/icons/icon.png $PREFIX/share/icons/hicolor/256x256/apps/com.hadc188.reader.png
  mkdir -p $PREFIX/share/applications
  cat > $PREFIX/share/applications/com.hadc188.reader.desktop <<DESKTOP_EOF
  [Desktop Entry]
  Type=Application
  Name=Reader
  Name[zh_CN]=阅读
  GenericName=Reader
  Comment=阅读 3.0 桌面版（书源 / 书架 / RSS / 本地书籍）
  Exec=/opt/apps/com.hadc188.reader/files/bin/start-reader
  Icon=com.hadc188.reader
  Terminal=false
  Categories=Network;Utility;Literature;
  StartupNotify=true
  DESKTOP_EOF
